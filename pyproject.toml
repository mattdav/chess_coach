[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "chess_coach"
authors = [
  {name = "Matthieu Daviaud", email = "matthieu.daviaud@gmail.com"},
]
version = "0.1.0"
description = "Assistant coach qui analyse mes parties avec caissAI et génère un plan d'entraînement"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.40.0",
    "beartype>=0.22.9",
    "httpx>=0.27.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "python-chess>=1.999",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
chess_coach = "chess_coach.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest-cov>=7.1.0",
    "types-pyyaml>=6.0.12.20260408",
]
docs = [
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
]
lint = [
    "mypy>=1.20.0",
    "ruff>=0.15.10",
]
podcast = [
    "podgenai>=0.17.2",
]

[tool.ruff]
target-version = "py313"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests", "src/chess_coach"]
addopts = [
    "--doctest-modules",
    "--cov=src/chess_coach",
    "--cov-report=term-missing",
    "--cov-report=html",
]
pythonpath = ["."]

[tool.coverage.run]
source = ["src/chess_coach"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "raise NotImplementedError",
]
skip_empty = true

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = [
    "chess.*",
]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/chess_coach"]

[tool.hatch.build.targets.wheel.force-include]
"src/chess_coach/py.typed" = "chess_coach/py.typed"
"src/chess_coach/config/player_config.yaml" = "chess_coach/config/player_config.yaml"
